name: Build CarHUD firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: CarHUD (ESP32-S3 ES3C28P)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.2.1 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "lvgl@9.6.0" "LovyanGFX@1.2.36"

      - name: Compile CarHUD for ES3C28P
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --warnings all \
            --export-binaries \
            --output-dir build \
            CarHUD

      - name: Create merged firmware image
        run: |
          set -euo pipefail
          mkdir -p firmware-output
          if [ -f build/CarHUD.ino.merged.bin ]; then
            cp build/CarHUD.ino.merged.bin firmware-output/CarHUD.ino.merged.bin
          else
            BOOTLOADER="$(find build -maxdepth 1 -name '*.bootloader.bin' -print -quit)"
            PARTITIONS="$(find build -maxdepth 1 -name '*.partitions.bin' -print -quit)"
            APP="$(find build -maxdepth 1 -name 'CarHUD.ino.bin' -print -quit)"
            BOOT_APP0="$(find ~/.arduino15/packages/esp32/hardware/esp32/3.2.1/tools/partitions -name boot_app0.bin -print -quit)"
            test -n "$BOOTLOADER" && test -n "$PARTITIONS" && test -n "$APP" && test -n "$BOOT_APP0"
            python -m pip install esptool==4.8.1
            python -m esptool --chip esp32s3 merge_bin \
              -o firmware-output/CarHUD.ino.merged.bin \
              --flash_mode dio --flash_size 16MB \
              0x0 "$BOOTLOADER" \
              0x8000 "$PARTITIONS" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$APP"
          fi
          test -s firmware-output/CarHUD.ino.merged.bin
          ls -lh firmware-output/CarHUD.ino.merged.bin

      - uses: actions/upload-artifact@v4
        with:
          name: CarHUD-ES3C28P-firmware
          path: firmware-output/CarHUD.ino.merged.bin
          if-no-files-found: error
